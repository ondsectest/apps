<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Same Tab Links</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" width="32" height="32">
    <h1>Same Tab Links</h1>
  </header>

  <main>
    <section class="current">
      <div class="current-text">
        <div id="site" class="site">&nbsp;</div>
        <div id="status" class="status" role="status"></div>
      </div>
      <label class="switch">
        <input id="toggle" type="checkbox" role="switch" aria-label="Open links in the same tab on this site" disabled>
        <span class="track"></span>
      </label>
    </section>

    <p id="note" class="note" hidden></p>

    <section id="listSection" hidden>
      <h2>Switched on for</h2>
      <ul id="list"></ul>
    </section>
  </main>

  <footer>Built by Santhosh Tuppad</footer>
  <script src="popup.js"></script>
</body>
</html>
